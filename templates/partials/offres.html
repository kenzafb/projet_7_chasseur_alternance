<!-- ════════════ PAGE OFFRES : liste et volet de détail (D145) ════════════ -->
<section class="page" data-page-content="offres">

  {% if analyse_ia|default(true) %}
  <!-- Offres pas encore notées : bandeau discret ; nombre, plafond et
       « toute la file » sont dans Paramètres, Réglages avancés -->
  <div class="bandeau-noter" data-analyse-attente hidden>
    <p class="bandeau-noter__txt"><strong data-analyse-nombre>0 nouvelle offre</strong> pas encore notée<span data-analyse-pluriel></span>.
      <span class="bandeau-noter__sous" data-analyse-estimation></span></p>
    <button type="button" class="btn" data-analyse-lancer>Les noter</button>
  </div>
  {% endif %}

  <div class="offres">
    <section class="offres__liste" aria-label="Liste des offres" data-offres-liste>
      <div class="onglets" role="group" aria-label="Classer les offres">
        <button type="button" class="onglet" data-onglet="avoir" aria-pressed="true">À voir · <span data-onglet-nombre="avoir">0</span></button>
        <button type="button" class="onglet" data-onglet="garde" aria-pressed="false">Gardées · <span data-onglet-nombre="garde">0</span></button>
        <button type="button" class="onglet" data-onglet="ecarte" aria-pressed="false">Écartées · <span data-onglet-nombre="ecarte">0</span></button>
      </div>

      <details class="offres__filtres">
        <summary>Filtrer</summary>
        <div class="offres__filtres-corps">
          <label class="filtre"><span>Source</span>
            <select class="filtre-menu" data-foffre="source">
              <option value="all">Toutes</option>
              <option value="ft">France Travail</option>
              <option value="lba">La Bonne Alternance</option>
            </select></label>
          <label class="filtre"><span>Lieu</span>
            <select class="filtre-menu" data-foffre="zone">
              <option value="all">Toute l'Île-de-France</option>
              <option value="Paris">Paris</option>
              <option value="Petite couronne">Petite couronne</option>
              <option value="Grande couronne">Grande couronne</option>
            </select></label>
          <label class="filtre"><span>Note</span>
            <select class="filtre-menu" data-foffre="score">
              <option value="all">Toutes les notes</option>
              <option value="haut">Bien (6 et plus)</option>
              <option value="moyen">Moyen (4 et 5)</option>
              <option value="bas">Faible (moins de 4)</option>
            </select></label>
          <!-- Onglet Écartées : par toi (« Pas pour moi ») ou par le Chasseur, avec sa raison -->
          <label class="filtre" data-filtre-ecartees hidden><span>Écartées</span>
            <select class="filtre-menu" data-foffre="ecartees">
              <option value="all">Toutes</option>
              <option value="toi">Par toi</option>
              <optgroup label="Par le Chasseur">
                <option value="chasseur">Toutes les raisons</option>
                <option value="ineligible">Conditions non remplies</option>
                <option value="note_basse">Note trop basse</option>
                <option value="hors_domaine">Hors de tes domaines</option>
                <option value="ecole_cfa">École ou CFA</option>
                <option value="public_specifique">Réservée à un public</option>
                <option value="stage">Pas un stage</option>
              </optgroup>
            </select></label>
        </div>
      </details>

      <p class="offres__vide" data-offres-vide hidden></p>
      <ul class="offres__items" data-list="offres">
        <!-- offres injectées par offres.js -->
      </ul>
    </section>

    <section class="volet" aria-label="Détail de l'offre" data-volet>
      <button type="button" class="btn btn--ghost volet__retour" data-volet-retour hidden>← Retour à la liste</button>
      <div data-volet-contenu>
        <p class="volet__vide">Choisis une offre dans la liste pour la lire ici.</p>
      </div>
    </section>
  </div>
</section>
