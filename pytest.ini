[pytest]
testpaths = tests
addopts = -p no:cacheprovider
filterwarnings =
    # Starlette recommande httpx2 pour son TestClient ; httpx reste supporté
    ignore:Using `httpx` with `starlette.testclient` is deprecated
    # datetime.utcnow() dans les valeurs par défaut de database/models.py (schéma, phase 2)
    ignore:datetime.datetime.utcnow:DeprecationWarning
