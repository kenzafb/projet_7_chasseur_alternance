[pytest]
testpaths = tests
addopts = -p no:cacheprovider
# Tout test qui dépasse 30 s échoue (pytest-timeout, méthode signal : le test
# en cause échoue avec sa pile, les suivants tournent). Lancer la suite sous
# plafond mémoire (README) : un emballement mémoire va plus vite que ce délai.
timeout = 30
timeout_method = signal
filterwarnings =
    # Starlette recommande httpx2 pour son TestClient ; httpx reste supporté
    ignore:Using `httpx` with `starlette.testclient` is deprecated
